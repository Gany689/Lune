<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Le Jeu de la Lune</title>

<style>
/* Layout: one narrow phone column — header with two clocks, a stack of moon-phase sessions, bottom tab bar, cards open as a bottom sheet. */
:root{
  --paper:#EAF0EE; --surface:#FAFCFB; --ink:#16303A; --muted:#5A6E75; --line:#CBD8D6;
  --lagoon:#0B7A78; --lagoon-soft:#CFE9E6; --marigold:#D98C06; --marigold-soft:#FBE7BE;
  --mine:#2A5FC4; --mine-ink:#FFFFFF;
  --lv-e:#2F7DD9; --lv-p:#2C9A57; --lv-d:#CF4436;
  --moon-dark:#C2CFCD; --moon-lit:#F3D58A;
  --shadow:0 10px 30px rgba(22,48,58,.14);
  --f-display:ui-rounded,"SF Pro Rounded","Sukhumvit Set","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:system-ui,-apple-system,"Sukhumvit Set","Thonburi","Noto Sans Thai","Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,Menlo,Consolas,"Roboto Mono",monospace;
  --fs-xs:.75rem; --fs-s:.875rem; --fs-m:1rem; --fs-l:1.25rem; --fs-xl:1.6rem; --fs-xxl:2.2rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1A1F; --surface:#15252C; --ink:#E4EEEC; --muted:#93A8AD; --line:#26404A;
  --lagoon:#3CC0B4; --lagoon-soft:#16413F; --marigold:#F2B43C; --marigold-soft:#3D3115;
  --mine:#5B8BEA; --mine-ink:#0E1A1F;
  --lv-e:#5C9DF0; --lv-p:#4CC07A; --lv-d:#F06A5B;
  --moon-dark:#26404A; --moon-lit:#F3D58A;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E1A1F; --surface:#15252C; --ink:#E4EEEC; --muted:#93A8AD; --line:#26404A;
  --lagoon:#3CC0B4; --lagoon-soft:#16413F; --marigold:#F2B43C; --marigold-soft:#3D3115;
  --mine:#5B8BEA; --mine-ink:#0E1A1F;
  --lv-e:#5C9DF0; --lv-p:#4CC07A; --lv-d:#F06A5B;
  --moon-dark:#26404A; --moon-lit:#F3D58A;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-m);line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:640px;margin:0 auto;padding-block:14px 110px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* header */
.top{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.top h1{font-size:var(--fs-l);font-weight:700}
.clocks{font-family:var(--f-mono);font-size:var(--fs-xs);color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.4}
.clocks b{color:var(--ink);font-weight:500}
.banner{background:var(--marigold-soft);border-radius:12px;padding:10px 12px;font-size:var(--fs-s)}

/* hero news */
.news{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.news .big{font-family:var(--f-display);font-size:var(--fs-l);font-weight:600}

/* sessions */
.session{display:flex;flex-direction:column;gap:10px;padding-block:6px}
.s-head{display:flex;align-items:center;gap:12px}
.s-head svg{flex:0 0 auto}
.s-head h2{font-size:var(--fs-l);font-weight:600}
.s-head .mono{display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:110px}
.tile:hover{border-color:var(--lagoon)}
.tile .q{font-size:var(--fs-s);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{display:flex;align-items:center;gap:6px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.lv-e{background:var(--lv-e)} .lv-p{background:var(--lv-p)} .lv-d{background:var(--lv-d)}
.tile.half{background:linear-gradient(90deg,var(--lagoon-soft) 50%,var(--surface) 50%)}
.tile.both{background:var(--lagoon-soft);border-color:var(--lagoon)}
.tag{position:absolute;top:-9px;right:10px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;background:var(--marigold);color:#1d1400;border-radius:999px;padding:1px 8px}
.locked{border:1.5px dashed var(--line);border-radius:14px;padding:14px;color:var(--muted);font-size:var(--fs-s)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-family:var(--f-display);font-weight:500;font-size:var(--fs-s);white-space:nowrap}
.chip[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip .cnt{display:inline-block;min-width:1.4em;border-radius:999px;background:var(--marigold);color:#1d1400;font-size:.7rem;padding:0 5px;text-align:center}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-size:var(--fs-l);font-weight:600}
.bignum{font-family:var(--f-display);font-size:var(--fs-xxl);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--lagoon-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lagoon);border-radius:999px}
.reward{display:flex;gap:10px;align-items:flex-start;padding-block:6px;border-top:1px solid var(--line)}
.reward:first-of-type{border-top:0}
.reward .pts{font-family:var(--f-mono);font-size:var(--fs-xs);min-width:56px;padding-top:3px;font-variant-numeric:tabular-nums}
.reward.won .pts{color:var(--lagoon);font-weight:500}
.reward small{display:block;color:var(--lagoon);font-size:var(--fs-xs)}
.jokers{font-size:1.4rem;letter-spacing:4px}
.jokers .off{opacity:.25}
ul.rules{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:var(--fs-s)}

/* forms */
label{font-size:var(--fs-s);color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,textarea,select{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--lagoon);outline:none}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--lagoon);color:var(--surface);font-weight:600}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:500}
.btn.small{padding:7px 12px;font-size:var(--fs-s)}
.btn:disabled{opacity:.5;cursor:default}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;gap:6px}
.tabs button{flex:1;max-width:200px;border:0;background:transparent;border-radius:12px;padding:8px;font-weight:500;color:var(--muted);font-family:var(--f-display)}
.tabs button[aria-current="true"]{background:var(--lagoon-soft);color:var(--ink)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,25,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .qbig{font-family:var(--f-display);font-size:var(--fs-xl);font-weight:600;line-height:1.3}
.sheet .alt{font-size:var(--fs-s);color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.linkbtn{background:none;border:0;padding:0;color:var(--lagoon);font-size:var(--fs-s);text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:380px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px;font-size:var(--fs-s);min-width:0}
.opt.g{border-color:var(--marigold);box-shadow:0 0 0 3px var(--marigold-soft)}
.opt.m{background:var(--mine);border-color:var(--mine);color:var(--mine-ink)}
.step{font-weight:600;font-size:var(--fs-s)}
.step.g{color:var(--marigold)} .step.m{color:var(--mine)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.duo{grid-template-columns:1fr}}
.ans{background:var(--paper);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ans .who{font-family:var(--f-display);font-weight:600}
.ans p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.ok{color:var(--lagoon);font-weight:600} .ko{color:var(--lv-d);font-weight:600}
.verdict{font-family:var(--f-display);font-size:var(--fs-l);font-weight:600;text-align:center;padding-block:4px}
.fact{background:var(--marigold-soft);border-radius:14px;padding:12px 14px;font-size:var(--fs-s)}
.talk{background:var(--lagoon-soft);border-radius:14px;padding:12px 14px;font-size:var(--fs-s)}
.wait{text-align:center;color:var(--muted);padding:10px;font-style:italic}
.reacts{display:flex;gap:6px;flex-wrap:wrap}
.reacts button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px;font-size:1.2rem}
.reacts button[aria-pressed="true"]{border-color:var(--lagoon);background:var(--lagoon-soft)}
.star-note{background:var(--marigold-soft);border-radius:12px;padding:10px 12px;font-weight:600;font-size:var(--fs-s)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 16px;font-size:var(--fs-s);max-width:90%;text-align:center}
.center{min-height:60vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.who-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who-pick button{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:18px 12px;font-family:var(--f-display);font-weight:600}
.who-pick button[aria-pressed="true"]{border-color:var(--lagoon);background:var(--lagoon-soft)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <span id="logo"></span>
    <div style="min-width:0">
      <h1 id="brand">Le Jeu de la Lune</h1>
      <div class="clocks" id="clocks"></div>
    </div>
  </header>
  <main id="view"><div class="center"><p class="muted">Chargement… · กำลังโหลด…</p></div></main>
</div>
<nav class="tabs" id="tabs" hidden></nav>
<div id="scrim" class="scrim" hidden></div>

<script>
/* ---------- contenu ---------- */
const T=(fr,th)=>({fr,th});
const CARDS=[
/* Session 1 */
{id:'c01',s:1,lvl:'e',t:'guess',q:T("Au réveil, je suis plutôt…","ตอนตื่นนอน ฉันเป็นแบบไหน"),
 o:[T("Un rayon de soleil ☀️","แสงแดดยามเช้า ☀️"),T("Un zombie tant que je n'ai pas mangé 🧟","ซอมบี้จนกว่าจะได้กินข้าว 🧟"),T("Je repousse le réveil 5 fois 😴","กดเลื่อนนาฬิกาปลุก 5 รอบ 😴"),T("Je regarde mon téléphone direct 📱","เปิดมือถือทันที 📱")],
 fact:T("Repousser son réveil ne repose pas plus : un sommeil coupé en petits morceaux récupère moins bien.","การกดเลื่อนนาฬิกาปลุกไม่ได้ทำให้พักผ่อนมากขึ้น เพราะการนอนที่ขาดเป็นช่วงๆ ฟื้นฟูร่างกายได้น้อยกว่า"),
 talk:T("Raconte ton pire réveil.","เล่าการตื่นนอนที่แย่ที่สุดของเธอ")},
{id:'c02',s:1,lvl:'e',t:'guess',q:T("Si j'étais un plat, je serais…","ถ้าฉันเป็นอาหาร ฉันจะเป็น…"),
 o:[T("Un pad thaï 🍜","ผัดไทย 🍜"),T("Un poisson cru au lait de coco 🐟","ปลาดิบราดกะทิแบบตาฮีตี 🐟"),T("Une pizza 🍕","พิซซ่า 🍕"),T("Un croissant 🥐","ครัวซองต์ 🥐")],
 talk:T("Quel plat veux-tu qu'on cuisine ensemble quand on se revoit ?","อยากทำอาหารอะไรด้วยกันตอนเจอกันครั้งหน้า")},
{id:'c03',s:1,lvl:'e',t:'talk',q:T("Quel est le surnom le plus ridicule qu'on t'ait donné ?","ชื่อเล่นที่ตลกที่สุดที่เคยมีคนเรียกเธอคืออะไร")},
{id:'c04',s:1,lvl:'e',t:'dare',q:T("Envoie un vocal où tu dis « je t'aime » dans la langue de l'autre, avec ton meilleur accent.","ส่งข้อความเสียงพูดว่า 'ฉันรักเธอ' เป็นภาษาของอีกฝ่าย ด้วยสำเนียงที่ดีที่สุดของเธอ")},
{id:'c05',s:1,lvl:'e',t:'guess',q:T("Mon super-pouvoir secret, c'est…","พลังพิเศษลับๆ ของฉันคือ…"),
 o:[T("Dormir n'importe où 😪","นอนได้ทุกที่ 😪"),T("Trouver les meilleures promos 🛍️","หาของลดราคาเก่ง 🛍️"),T("Manger épicé sans pleurer 🌶️","กินเผ็ดได้ไม่ร้องไห้ 🌶️"),T("Avoir raison. Toujours. 😇","ถูกเสมอ ทุกครั้ง 😇")]},
{id:'c06',s:1,lvl:'e',t:'guess',q:T("En vacances ensemble, je serais celui ou celle qui…","ถ้าไปเที่ยวด้วยกัน ฉันจะเป็นคนที่…"),
 o:[T("Planifie tout à la minute 📋","วางแผนทุกนาที 📋"),T("Se perd en 10 minutes 🗺️","หลงทางภายใน 10 นาที 🗺️"),T("Prend 400 photos 📸","ถ่ายรูป 400 รูป 📸"),T("Dort sur la plage 🏖️","นอนบนชายหาด 🏖️")]},
{id:'c07',s:1,lvl:'e',t:'talk',q:T("Qu'as-tu fait aujourd'hui que je n'aurais jamais deviné ?","วันนี้เธอทำอะไรที่ฉันคงเดาไม่ถูก")},
{id:'c08',s:1,lvl:'e',t:'dare',q:T("Dessine l'autre de mémoire en 30 secondes et envoie la photo. Interdit de s'excuser.","วาดรูปอีกฝ่ายจากความจำใน 30 วินาที แล้วส่งรูปมา ห้ามขอโทษ")},
/* Session 2 */
{id:'c09',s:2,lvl:'p',t:'guess',q:T("Ce qui me manque le plus de toi en ce moment…","สิ่งที่ฉันคิดถึงในตัวเธอที่สุดตอนนี้…"),
 o:[T("Ton rire","เสียงหัวเราะของเธอ"),T("Tes câlins","อ้อมกอดของเธอ"),T("Manger avec toi","การกินข้าวด้วยกัน"),T("Ne rien faire ensemble","การไม่ทำอะไรเลยด้วยกัน")],
 fact:T("Selon une étude, entendre la voix d'un proche fait baisser l'hormone du stress presque autant qu'un câlin. Les vocaux comptent.","มีงานวิจัยบอกว่า การได้ยินเสียงคนที่รักช่วยลดฮอร์โมนความเครียดได้เกือบเท่ากับการกอด ข้อความเสียงจึงสำคัญนะ")},
{id:'c10',s:2,lvl:'p',t:'talk',q:T("Quel moment de notre histoire tu revis le plus souvent dans ta tête ?","ช่วงเวลาไหนของเราที่เธอนึกถึงบ่อยที่สุด")},
{id:'c11',s:2,lvl:'e',t:'guess',q:T("Notre plus grosse dispute serait à propos de…","ถ้าเราทะเลาะกันหนักๆ น่าจะเป็นเรื่อง…"),
 o:[T("La clim (trop froid, trop chaud) ❄️","แอร์ (หนาวไป ร้อนไป) ❄️"),T("Qui a mangé le dernier morceau 🍰","ใครกินชิ้นสุดท้าย 🍰"),T("Être en retard ⏰","มาสาย ⏰"),T("Le choix du film 🎬","เลือกหนัง 🎬")]},
{id:'c12',s:2,lvl:'e',t:'dare',q:T("Fais visiter ta chambre en vidéo ou en vocal, comme un agent immobilier beaucoup trop enthousiaste.","พาทัวร์ห้องของเธอผ่านวิดีโอหรือข้อความเสียง เหมือนนายหน้าขายบ้านที่ตื่นเต้นเกินเหตุ")},
{id:'c13',s:2,lvl:'p',t:'guess',q:T("Quand je suis triste, ce qui m'aide le plus…","เวลาฉันเศร้า สิ่งที่ช่วยได้มากที่สุดคือ…"),

 talk:T("Comment je peux mieux t'aider, à distance, quand ça ne va pas ?","เวลาเธอไม่สบายใจ ฉันช่วยจากที่ไกลได้ยังไงบ้าง")},
{id:'c14',s:2,lvl:'e',t:'talk',q:T("Apprends-moi un mot de ta langue que j'adorerais, et dis-moi quand l'utiliser.","สอนคำในภาษาของเธอที่ฉันน่าจะชอบ และบอกว่าใช้ตอนไหน"),

['quiz','e',"En France, combien de bises fait-on pour dire bonjour ?","ในฝรั่งเศส เวลาทักทายหอมแก้มกี่ครั้ง",[["Toujours 2","2 ครั้งเสมอ"],["De 1 à 4, selon la région","1 ถึง 4 ครั้ง แล้วแต่ภูมิภาค"],["Toujours 3","3 ครั้งเสมอ"],["Aucune","ไม่หอมเลย"]],{a:1,f:["Paris en fait 2, une partie du sud 3, et certains coins de l'ouest jusqu'à 4. En Thaïlande, on ne se touche pas pour saluer : on fait le wai.","ปารีสหอม 2 ครั้ง ทางใต้บางที่ 3 ครั้ง บางพื้นที่ทางตะวันตกถึง 4 ครั้ง ส่วนคนไทยไม่แตะตัวกันตอนทักทาย แต่ไหว้"]}],
['quiz','e',"Comment s'appelle le salut thaï, mains jointes ?","การพนมมือทักทายแบบไทยเรียกว่าอะไร",[["Le wai","ไหว้"],["Le namasté","นมัสเต"],["Le kowtow","โขกศีรษะ"],["La révérence","ถอนสายบัว"]],{a:0,f:["Plus les mains sont hautes, plus le respect est grand, et les plus jeunes saluent en premier. En France, on se serre la main ou on se fait la bise, et le respect passe surtout par les mots.","ยิ่งยกมือสูง ยิ่งเคารพมาก และเด็กกว่าไหว้ก่อน ส่วนคนฝรั่งเศสจับมือหรือหอมแก้ม และแสดงความเคารพด้วยคำพูดเป็นหลัก"],k:["Montre-moi le bon wai pour tes parents. Et toi, entraîne-toi à la bise.","สอนฉันไหว้พ่อแม่เธอให้ถูก แล้วเธอลองฝึกหอมแก้มแบบฝรั่งเศสด้วย"]}],
['quiz','e',"La première fois qu'on rencontre ses beaux-parents en France, on leur dit…","ครั้งแรกที่เจอพ่อแม่แฟนในฝรั่งเศส ควรใช้คำว่า…",[["« Vous », par respect","'vous' เพื่อแสดงความเคารพ"],["« Tu », pour être proche","'tu' ให้ดูสนิท"],["« Papa » et « maman »","'พ่อ' กับ 'แม่'"],["Rien, on attend qu'ils parlent","ไม่พูด รอให้ท่านพูดก่อน"]],{a:0,f:["Le « vous » marque le respect ; on passe au « tu » quand ils le proposent. En thaï, le respect passe par « khrap » ou « kha », et par les mots « phi » et « nong ».","'vous' แสดงความเคารพ จะเปลี่ยนเป็น 'tu' เมื่อท่านชวน ส่วนภาษาไทยแสดงความเคารพด้วย ครับ ค่ะ และคำว่า พี่ น้อง"]}],
['quiz','e',"À quelle heure dîne-t-on souvent en France ?","คนฝรั่งเศสมักกินข้าวเย็นกี่โมง",[["Vers 18 h","ราว 18.00 น."],["Vers 20 h","ราว 20.00 น."],["Vers 22 h","ราว 22.00 น."],["On ne dîne pas","ไม่กินมื้อเย็น"]],{a:1,f:["Et entre les repas, on grignote peu. En Thaïlande, on mange plus souvent, par petites portions, et la street food est partout à toute heure.","และไม่ค่อยกินจุบจิบระหว่างมื้อ ส่วนคนไทยกินบ่อยกว่า ทีละน้อย และมีสตรีทฟู้ดทุกเวลา"]}],
['quiz','e',"Combien de temps peut durer un repas de fête en France ?","มื้ออาหารวันพิเศษในฝรั่งเศสกินนานแค่ไหน",[["30 minutes","30 นาที"],["1 heure","1 ชั่วโมง"],["3 heures ou plus","3 ชั่วโมงขึ้นไป"],["10 minutes","10 นาที"]],{a:2,f:["Les plats arrivent l'un après l'autre : entrée, plat, fromage, dessert, café. Le « repas gastronomique des Français » est à l'UNESCO depuis 2010. En Thaïlande, tout arrive ensemble au centre de la table et on partage.","อาหารมาทีละจาน: อาหารเรียกน้ำย่อย จานหลัก ชีส ของหวาน กาแฟ และเป็นมรดกยูเนสโกตั้งแต่ปี 2010 ส่วนคนไทยวางอาหารทุกอย่างกลางโต๊ะแล้วแบ่งกันกิน"],k:["Tu préfères quoi : les plats l'un après l'autre, ou tout partagé au milieu ?","ชอบแบบไหน กินทีละจาน หรือวางรวมกันกลางโต๊ะ"]}],

['quiz','e',"En France, où pose-t-on son pain pendant le repas ?","ในฝรั่งเศส ระหว่างกินข้าว วางขนมปังไว้ที่ไหน",[["Directement sur la table","บนโต๊ะเลย"],["Dans l'assiette","ในจาน"],["Sur ses genoux","บนตัก"],["On n'en mange pas","ไม่กินขนมปัง"]],{a:0,f:["Le pain est posé à côté de l'assiette et sert à « saucer » le plat. En Thaïlande, c'est le riz qui accompagne tout.","วางขนมปังข้างจาน แล้วใช้เช็ดซอสในจาน ส่วนคนไทยมีข้าวเป็นคู่กับทุกอย่าง"]}],
['quiz','e',"En France, le grand repas de Noël a souvent lieu…","ในฝรั่งเศส มื้อใหญ่วันคริสต์มาสมักจัดเมื่อไหร่",[["Le 24 au soir","คืนวันที่ 24"],["Le 25 au matin","เช้าวันที่ 25"],["Le 31 décembre","31 ธันวาคม"],["Le 6 janvier","6 มกราคม"]],{a:0,f:["C'est le « réveillon », en famille, avec huîtres, foie gras et bûche. En Thaïlande, Noël n'est pas une fête traditionnelle, mais les centres commerciaux le décorent beaucoup.","เรียกว่า 'เรวัยยง' กินกับครอบครัว มีหอยนางรม ฟัวกรา และเค้กขอนไม้ ส่วนในไทยคริสต์มาสไม่ใช่เทศกาลดั้งเดิม แต่ห้างตกแต่งสวยมาก"],k:["Comment fêtera-t-on Noël, nous deux ?","คริสต์มาสของเราสองคนจะฉลองยังไง"]}],
['quiz','e',"À minuit, le 31 décembre, les Français…","เที่ยงคืนวันที่ 31 ธันวาคม คนฝรั่งเศส…",[["S'embrassent et se souhaitent une bonne année","หอมแก้มและอวยพรปีใหม่"],["S'arrosent d'eau","สาดน้ำกัน"],["Mangent 12 grains de raisin","กินองุ่น 12 ลูก"],["Lâchent des lanternes","ปล่อยโคมลอย"]],{a:0,f:["On a jusqu'à fin janvier pour souhaiter « bonne année ». La Thaïlande, elle, a trois Nouvel An : le 1er janvier, le Nouvel An chinois et Songkran en avril.","คนฝรั่งเศสอวยพรปีใหม่ได้ถึงปลายมกราคม ส่วนไทยมีปีใหม่สามครั้ง: 1 มกราคม ตรุษจีน และสงกรานต์ในเดือนเมษายน"]}],
['quiz','e',"Le 14 juillet, la France fête…","วันที่ 14 กรกฎาคม ฝรั่งเศสฉลองอะไร",[["La prise de la Bastille","การทลายคุกบาสตีย์"],["La fin d'une guerre","สิ้นสุดสงคราม"],["L'anniversaire du président","วันเกิดประธานาธิบดี"],["La fête des pères","วันพ่อ"]],{a:0,f:["En 1789, le peuple de Paris prend la prison de la Bastille : c'est le début de la Révolution. En Thaïlande, la fête des pères est le 5 décembre, anniversaire du roi Rama IX.","ปี 1789 ชาวปารีสบุกยึดคุกบาสตีย์ เป็นจุดเริ่มการปฏิวัติ ส่วนวันพ่อของไทยคือ 5 ธันวาคม วันคล้ายวันพระราชสมภพรัชกาลที่ 9"]}],
['quiz','e',"Que fait-on le 1er avril en France ?","วันที่ 1 เมษายน คนฝรั่งเศสทำอะไร",[["On colle un poisson en papier dans le dos des gens","แอบแปะปลากระดาษที่หลังคนอื่น"],["On mange des œufs","กินไข่"],["On s'arrose d'eau","สาดน้ำกัน"],["On offre des fleurs","ให้ดอกไม้"]],{a:0,f:["C'est le « poisson d'avril », la journée des blagues. À la mi-avril, la Thaïlande s'arrose pour Songkran.","เรียกว่า 'ปลาเดือนเมษายน' เป็นวันแกล้งกัน ส่วนกลางเดือนเมษายนคนไทยสาดน้ำกันวันสงกรานต์"]}],
['quiz','e',"Combien de semaines de congés payés a un salarié en France ?","พนักงานในฝรั่งเศสมีวันหยุดพักร้อนกี่สัปดาห์ต่อปี",[["2","2"],["5","5"],["10","10"],["1","1"]],{a:1,f:["Cinq semaines, et beaucoup de Français partent en août : Paris se vide. En Thaïlande, le minimum légal est de 6 jours par an, avec de nombreux jours fériés.","ห้าสัปดาห์ และคนฝรั่งเศสจำนวนมากไปเที่ยวในเดือนสิงหาคมจนปารีสเงียบ ส่วนในไทยกฎหมายกำหนดขั้นต่ำ 6 วันต่อปี แต่มีวันหยุดนักขัตฤกษ์เยอะ"],k:["Pour toi, le travail ou le temps libre, qu'est-ce qui passe en premier ?","สำหรับเธอ งานหรือเวลาว่าง อะไรสำคัญกว่า"]}],
['quiz','p',"La France est un pays laïque. Cela veut dire que…","ฝรั่งเศสเป็นรัฐฆราวาส หมายความว่า…",[["L'État ne favorise aucune religion","รัฐไม่สนับสนุนศาสนาใดเป็นพิเศษ"],["La religion est interdite","ห้ามนับถือศาสนา"],["Tout le monde est catholique","ทุกคนเป็นคาทอลิก"],["On prie à l'école","สวดมนต์ที่โรงเรียน"]],{a:0,f:["Chacun croit ce qu'il veut, mais l'école et l'administration restent neutres. En Thaïlande, plus de 90 % des habitants sont bouddhistes, et les moines font partie de la vie quotidienne.","ทุกคนนับถืออะไรก็ได้ แต่โรงเรียนและหน่วยงานรัฐต้องเป็นกลาง ส่วนในไทยคนกว่า 90% นับถือพุทธ และพระสงฆ์อยู่ในชีวิตประจำวัน"],k:["Quelle place veux-tu donner à la spiritualité dans notre foyer ?","อยากให้ความเชื่อทางศาสนามีบทบาทแค่ไหนในบ้านของเรา"]}],
['quiz','e',"Quelle est la devise de la France ?","คำขวัญประจำชาติฝรั่งเศสคืออะไร",[["Liberté, Égalité, Fraternité","เสรีภาพ เสมอภาค ภราดรภาพ"],["Dieu, Roi, Patrie","พระเจ้า กษัตริย์ ปิตุภูมิ"],["Travail, Famille, Patrie","งาน ครอบครัว ปิตุภูมิ"],["Paix et Amour","สันติภาพและความรัก"]],{a:0,f:["La Thaïlande a aussi ses trois piliers : la Nation, la Religion et la Monarchie (« chat, satsana, phra mahakasat »).","ส่วนไทยก็มีสามสถาบันหลัก: ชาติ ศาสนา พระมหากษัตริย์"],k:["Laquelle de ces valeurs compte le plus pour toi ?","ค่านิยมไหนสำคัญกับเธอที่สุด"]}],
['quiz','e',"En entrant dans une boulangerie en France, on dit d'abord…","เข้าร้านขนมปังในฝรั่งเศส ต้องพูดอะไรก่อน",[["« Bonjour »","'Bonjour' (สวัสดี)"],["« Une baguette »","'ขอบาแกตหนึ่งแท่ง'"],["Rien","ไม่พูดอะไร"],["« Merci »","'ขอบคุณ'"]],{a:0,f:["Oublier le « bonjour » est vu comme très impoli. En Thaïlande, c'est le sourire, le wai et les mots « khrap » ou « kha » qui montrent la politesse.","ลืมพูด 'bonjour' ถือว่าเสียมารยาทมาก ส่วนในไทยแสดงความสุภาพด้วยรอยยิ้ม การไหว้ และคำว่า ครับ ค่ะ"]}],
['quiz','e',"Au restaurant en France, le pourboire est…","ในร้านอาหารฝรั่งเศส ทิปเป็นแบบไหน",[["Facultatif, le service est déjà compris","ไม่บังคับ รวมค่าบริการแล้ว"],["Obligatoire, 20 %","บังคับ 20%"],["Interdit","ห้ามให้"],["Donné directement au chef","ให้เชฟโดยตรง"]],{a:0,f:["On laisse un peu si on est content. En Thaïlande non plus, ce n'est pas obligatoire, mais on laisse souvent la petite monnaie.","ถ้าพอใจก็ให้เพิ่มเล็กน้อย ในไทยก็ไม่บังคับเหมือนกัน แต่คนมักทิ้งเศษเหรียญไว้"]}],
['quiz','e',"L'« apéro », en France, c'est…","'อาเปโร' ในฝรั่งเศสคืออะไร",[["Boire un verre et grignoter avant le repas","ดื่มและกินของว่างก่อนมื้ออาหาร"],["Le dessert","ของหวาน"],["Le petit-déjeuner","อาหารเช้า"],["Une sieste","งีบหลับ"]],{a:0,f:["C'est un vrai rituel entre amis ou en famille. Il peut même remplacer le dîner : on appelle ça un « apéro dînatoire ».","เป็นธรรมเนียมสำคัญกับเพื่อนหรือครอบครัว บางครั้งกินจนแทนมื้อเย็นไปเลย เรียกว่า 'อาเปโรดีนาตัวร์'"]}],
['quiz','p',"À table, les Français adorent…","ที่โต๊ะอาหาร คนฝรั่งเศสชอบ…",[["Débattre, même de politique","ถกเถียง แม้แต่เรื่องการเมือง"],["Manger en silence","กินเงียบๆ"],["Regarder la télévision","ดูทีวี"],["Manger très vite","กินเร็วมาก"]],{a:0,f:["Être en désaccord n'est pas impoli en France : on argumente, puis on trinque. En Thaïlande, on évite plutôt le conflit ouvert pour ne faire perdre la face à personne.","ในฝรั่งเศส การเห็นต่างไม่ใช่เรื่องเสียมารยาท เถียงกันเสร็จก็ชนแก้วกัน ส่วนคนไทยเลี่ยงการขัดแย้งตรงๆ เพื่อไม่ให้ใครเสียหน้า"],k:["Quand on n'est pas d'accord, tu préfères en débattre tout de suite ou attendre que ça se calme ?","เวลาเราเห็นไม่ตรงกัน เธอชอบคุยกันทันที หรือรอให้ใจเย็นก่อน"]}],
['quiz','e',"Le « sport national » des Français, selon la blague, c'est…","ตามมุกตลก 'กีฬาประจำชาติ' ของคนฝรั่งเศสคือ…",[["Râler (se plaindre)","บ่น"],["Le football","ฟุตบอล"],["La pétanque","เปตอง"],["Le vélo","ปั่นจักรยาน"]],{a:0,f:["Se plaindre est presque un art de vivre, souvent pour créer du lien plutôt que par vraie colère. En Thaïlande, montrer son mécontentement en public est plutôt mal vu.","การบ่นเกือบเป็นวิถีชีวิต มักเป็นการสร้างความสนิทมากกว่าโกรธจริง ส่วนในไทย การแสดงความไม่พอใจในที่สาธารณะไม่ค่อยดีนัก"],k:["Ça t'énerve ou ça te fait rire quand je râle ?","เวลาฉันบ่น เธอหงุดหงิดหรือขำ"]}],
['quiz','e',"Quel pays gagne très souvent des médailles mondiales… de pétanque ?","ประเทศไหนได้เหรียญเปตองระดับโลกบ่อยมาก",[["La Thaïlande","ไทย"],["Le Japon","ญี่ปุ่น"],["Le Brésil","บราซิล"],["Le Canada","แคนาดา"]],{a:0,f:["La pétanque est née à La Ciotat, en Provence, en 1907. Elle est devenue très populaire en Thaïlande, qui fait partie des meilleures nations du monde.","เปตองเกิดที่เมืองลาซีโอตาในแคว้นโพรวองซ์ ปี 1907 และได้รับความนิยมมากในไทย จนไทยเป็นหนึ่งในชาติที่เก่งที่สุดในโลก"]}],
['quiz','e',"La tour Eiffel devait, au départ…","ตอนแรกหอไอเฟลถูกวางแผนว่าจะ…",[["Être démontée après 20 ans","ถูกรื้อหลัง 20 ปี"],["Devenir une église","เป็นโบสถ์"],["Servir de phare","เป็นประภาคาร"],["Être deux fois plus haute","สูงกว่านี้สองเท่า"]],{a:0,f:["Construite pour l'Exposition universelle de 1889, elle devait disparaître en 1909. Ses antennes radio l'ont sauvée.","สร้างเพื่องานมหกรรมโลกปี 1889 และควรถูกรื้อในปี 1909 แต่เสาอากาศวิทยุช่วยให้ยังอยู่"]}],
['quiz','e',"Pourquoi se regarde-t-on dans les yeux en trinquant en France ?","ทำไมคนฝรั่งเศสต้องสบตากันตอนชนแก้ว",[["Sinon, sept ans de malheur en amour","ไม่งั้นจะโชคร้ายเรื่องความรักเจ็ดปี"],["Par respect pour le chef","เพื่อเคารพเชฟ"],["Pour vérifier qu'on n'est pas ivre","เพื่อเช็กว่ายังไม่เมา"],["Aucune raison","ไม่มีเหตุผล"]],{a:0,f:["C'est une superstition, mais tout le monde la respecte. On dit « santé ! » ou « tchin ! ». En Thaïlande, on dit « chon kaew ! ».","เป็นความเชื่อ แต่ทุกคนทำตาม คนฝรั่งเศสพูดว่า 'santé!' หรือ 'tchin!' ส่วนคนไทยพูดว่า 'ชนแก้ว!'"]}],
['quiz','p',"En France, un mariage est légalement valable quand il est célébré…","ในฝรั่งเศส การแต่งงานจะถูกต้องตามกฎหมายเมื่อจัดที่…",[["À la mairie","ศาลาว่าการเมือง (แมรี)"],["À l'église seulement","โบสถ์เท่านั้น"],["Au tribunal","ศาล"],["À la maison","ที่บ้าน"]],{a:0,f:["Seul le mariage civil à la mairie compte légalement ; la cérémonie religieuse est facultative et vient après. En Thaïlande, la cérémonie traditionnelle se fait souvent à la maison avec les moines et le « rot nam sang », et l'enregistrement se fait au bureau du district.","มีแค่การแต่งงานที่ศาลาว่าการเมืองที่ถูกกฎหมาย พิธีทางศาสนาจะทำหรือไม่ก็ได้ ส่วนในไทย พิธีมักจัดที่บ้าน มีพระสงฆ์และพิธีรดน้ำสังข์ แล้วไปจดทะเบียนที่อำเภอ"]}],
['quiz','p',"Dans un mariage thaï, le « sin sot » est…","ในงานแต่งไทย 'สินสอด' คือ…",[["Une dot offerte à la famille de la mariée","เงินหรือทองที่มอบให้ครอบครัวเจ้าสาว"],["Une danse","การเต้นรำ"],["Un gâteau","เค้ก"],["Une promesse écrite","คำสัญญาที่เขียนไว้"]],{a:0,f:["C'est une marque de respect envers les parents qui ont élevé la mariée, et elle est parfois rendue au couple après le mariage. Cette tradition n'existe pas en France.","เป็นการแสดงความเคารพพ่อแม่ที่เลี้ยงเจ้าสาวมา บางครอบครัวคืนให้คู่บ่าวสาวหลังงาน ประเพณีนี้ไม่มีในฝรั่งเศส"],k:["Parlons-en franchement : qu'en pensent ta famille et la mienne ?","คุยกันตรงๆ เลย ครอบครัวเธอกับครอบครัวฉันคิดยังไงเรื่องนี้"]}],
['quiz','e',"Chez des Français, enlève-t-on ses chaussures en entrant ?","ไปบ้านคนฝรั่งเศส ต้องถอดรองเท้าไหม",[["Pas forcément, ça dépend des familles","ไม่เสมอไป แล้วแต่บ้าน"],["Toujours","ถอดเสมอ"],["Jamais, c'est impoli","ห้ามถอด เสียมารยาท"],["Seulement le dimanche","เฉพาะวันอาทิตย์"]],{a:0,f:["Beaucoup de Français gardent leurs chaussures à la maison. En Thaïlande, on les retire toujours avant d'entrer dans une maison ou un temple.","คนฝรั่งเศสหลายคนใส่รองเท้าในบ้าน ส่วนคนไทยถอดรองเท้าเสมอก่อนเข้าบ้านหรือวัด"],k:["Chez nous, ce sera chaussures ou pas ?","บ้านของเรา จะถอดรองเท้าหรือไม่"]}],
['quiz','e',"Les Français mangent-ils vraiment des cuisses de grenouille ?","คนฝรั่งเศสกินขากบจริงไหม",[["Oui, mais rarement, surtout au restaurant","จริง แต่ไม่บ่อย ส่วนใหญ่กินที่ร้าน"],["Tous les jours","ทุกวัน"],["Jamais, c'est une légende","ไม่เลย เป็นแค่ตำนาน"],["Seulement à Noël","เฉพาะคริสต์มาส"]],{a:0,f:["C'est un plat de fête dans certaines régions. Les Thaïlandais en mangent bien plus souvent que les Français, frites ou en curry !","เป็นอาหารพิเศษในบางภูมิภาค คนไทยกินกบบ่อยกว่าคนฝรั่งเศสอีก ทั้งทอดและแกง!"]}],
['quiz','e',"En 2022, l'UNESCO a inscrit quel savoir-faire français à son patrimoine ?","ปี 2022 ยูเนสโกขึ้นทะเบียนภูมิปัญญาฝรั่งเศสอะไร",[["La baguette","ขนมปังบาแกต"],["Le croissant","ครัวซองต์"],["Le fromage","ชีส"],["La bise","การหอมแก้ม"]],{a:0,f:["Le croissant, lui, est d'origine autrichienne. La Thaïlande a aussi son inscription : le massage thaï, depuis 2019.","ครัวซองต์มีต้นกำเนิดจากออสเตรีย ส่วนไทยมี 'นวดไทย' ที่ขึ้นทะเบียนตั้งแต่ปี 2019"]}],
['quiz','e',"Pourquoi appelle-t-on la France « l'Hexagone » ?","ทำไมเรียกฝรั่งเศสว่า 'เฮกซากอน'",[["Pour sa forme à six côtés","เพราะรูปร่างคล้ายหกเหลี่ยม"],["Pour ses six régions","เพราะมีหกภูมิภาค"],["À cause d'un roi","เพราะกษัตริย์องค์หนึ่ง"],["Pour ses six fleuves","เพราะมีแม่น้ำหกสาย"]],{a:0,f:["Et la carte de la Thaïlande est souvent comparée à une tête d'éléphant, avec le sud comme trompe.","ส่วนแผนที่ประเทศไทยมักถูกเปรียบว่าเหมือนหัวช้าง โดยมีภาคใต้เป็นงวง"]}],
['quiz','e',"Dans combien de pays le français est-il une langue officielle ?","ภาษาฝรั่งเศสเป็นภาษาราชการในกี่ประเทศ",[["Environ 5","ประมาณ 5"],["Environ 29","ประมาณ 29"],["Plus de 80","มากกว่า 80"],["Un seul","ประเทศเดียว"]],{a:1,f:["On le parle sur les cinq continents. Le thaï est surtout parlé en Thaïlande, mais il est proche du lao : Thaïlandais et Laotiens se comprennent souvent.","พูดกันทั้งห้าทวีป ส่วนภาษาไทยพูดในไทยเป็นหลัก แต่ใกล้กับภาษาลาว คนไทยกับคนลาวจึงมักเข้าใจกัน"]}],
['quiz','p',"En France, à quel âge quitte-t-on souvent le domicile de ses parents ?","ในฝรั่งเศส คนมักย้ายออกจากบ้านพ่อแม่ตอนอายุเท่าไร",[["Vers 23-24 ans","ราว 23-24 ปี"],["Seulement après le mariage","หลังแต่งงานเท่านั้น"],["Jamais","ไม่ย้ายเลย"],["À 15 ans","15 ปี"]],{a:0,f:["Les jeunes Français prennent souvent leur indépendance pour les études ou le travail. En Thaïlande, plusieurs générations vivent souvent ensemble, et prendre soin de ses parents est un devoir de cœur.","คนหนุ่มสาวฝรั่งเศสมักแยกไปอยู่เองเพื่อเรียนหรือทำงาน ส่วนในไทยหลายรุ่นมักอยู่บ้านเดียวกัน และการดูแลพ่อแม่เป็นหน้าที่จากใจ"],k:["Plus tard, comment veux-tu qu'on s'occupe de nos parents ?","ในอนาคต อยากให้เราดูแลพ่อแม่ของเรายังไง"]}],
['quiz','e',"Que veut dire « sanuk », un mot thaï très important ?","คำว่า 'สนุก' ภาษาฝรั่งเศสใกล้กับคำไหนที่สุด",[["Le plaisir, l'amusement","plaisir (ความสนุก ความเพลิดเพลิน)"],["La politesse","politesse (ความสุภาพ)"],["Le travail","travail (งาน)"],["La nourriture","nourriture (อาหาร)"]],{a:0,f:["Pour beaucoup de Thaïlandais, une activité, même le travail, devrait être « sanuk ». Les Français parlent de « joie de vivre »… tout en râlant un peu.","สำหรับคนไทย ทุกอย่างแม้แต่งานก็ควร 'สนุก' ส่วนคนฝรั่งเศสพูดถึง 'joie de vivre' ความสุขในการใช้ชีวิต แต่ก็บ่นไปด้วย"]}],
['quiz','e',"« Mai pen rai », expression thaïe très courante, veut dire…","'ไม่เป็นไร' ตรงกับภาษาฝรั่งเศสคำไหนที่สุด",[["Pas grave, ce n'est rien","Pas grave (ไม่เป็นไร)"],["Je ne sais pas","Je ne sais pas (ไม่รู้)"],["Fais attention","Fais attention (ระวังนะ)"],["Pas maintenant","Pas maintenant (ไม่ใช่ตอนนี้)"]],{a:0,f:["C'est presque une philosophie : garder son calme et ne faire perdre la face à personne. Un Français dira « c'est pas grave »… mais il en reparlera peut-être.","เกือบเป็นปรัชญาชีวิต: ใจเย็น ไม่ทำให้ใครเสียหน้า คนฝรั่งเศสก็พูดว่า 'c'est pas grave' แต่อาจกลับมาพูดเรื่องนี้อีก"]}],
['quiz','e',"Avant un film au cinéma en Thaïlande, que fait-on ?","ก่อนหนังฉายในโรงภาพยนตร์ไทย คนดูทำอะไร",[["On se lève pour l'hymne royal","ยืนเคารพเพลงสรรเสริญพระบารมี"],["On applaudit","ปรบมือ"],["On chante en chœur","ร้องเพลงพร้อมกัน"],["Rien de spécial","ไม่มีอะไรพิเศษ"]],{a:0,f:["La monarchie est très respectée en Thaïlande. En France, l'hymne national, La Marseillaise, s'entend surtout aux matchs et aux cérémonies.","สถาบันพระมหากษัตริย์ได้รับความเคารพมากในไทย ส่วนในฝรั่งเศส เพลงชาติ 'ลามาร์แซแยซ' จะได้ยินในการแข่งกีฬาและพิธีการ"]}],
['quiz','e',"En 2026, en quelle année est-on selon le calendrier bouddhiste thaï ?","ปี 2026 ตรงกับพุทธศักราชเท่าไร",[["2569","2569"],["2483","2483"],["2600","2600"],["2526","2526"]],{a:0,f:["Le calendrier thaï a 543 ans d'avance : 2026 + 543 = 2569. En France, on utilise uniquement le calendrier grégorien.","ปฏิทินไทยนำหน้า 543 ปี: 2026 + 543 = 2569 ส่วนฝรั่งเศสใช้แค่คริสต์ศักราช"]}],
['quiz','e',"Quelle fête thaïe célèbre la pleine lune en faisant flotter de petits paniers sur l'eau ?","เทศกาลไทยไหนที่ฉลองคืนพระจันทร์เต็มดวงด้วยการปล่อยของลอยน้ำ",[["Loy Krathong","ลอยกระทง"],["Songkran","สงกรานต์"],["Visakha Bucha","วิสาขบูชา"],["Le Nouvel An chinois","ตรุษจีน"]],{a:0,f:["Elle a lieu à la pleine lune du 12e mois lunaire, souvent en novembre : on laisse partir ses soucis et on fait un vœu. Parfait pour Le Jeu de la Lune.","ตรงกับคืนเพ็ญเดือนสิบสอง มักอยู่ในเดือนพฤศจิกายน เป็นการลอยความทุกข์และอธิษฐาน เหมาะกับเกมพระจันทร์ของเราที่สุด"],k:["Quel vœu ferais-tu cette année ?","ปีนี้เธอจะอธิษฐานว่าอะไร"]}],
['quiz','e',"Que veut dire « 555 » dans un message thaï ?","'555' ในข้อความภาษาไทยหมายถึงอะไร",[["Hahaha","ฮ่าฮ่าฮ่า"],["Bisous","จุ๊บๆ"],["Au revoir","ลาก่อน"],["Je suis fâché(e)","โกรธแล้ว"]],{a:0,f:["Le chiffre 5 se dit « ha » en thaï. En France, on écrit « mdr », pour « mort de rire ».","เลข 5 ภาษาไทยออกเสียงว่า 'ห้า' ส่วนคนฝรั่งเศสพิมพ์ 'mdr' ย่อมาจาก 'หัวเราะจนตาย'"]}],
['quiz','e',"Pourquoi ne touche-t-on pas la tête de quelqu'un en Thaïlande ?","ทำไมในประเทศไทยไม่ควรจับหัวคนอื่น",[["C'est la partie la plus respectée du corps","ศีรษะเป็นของสูง"],["Ça fait tomber les cheveux","ทำให้ผมร่วง"],["C'est réservé aux médecins","สงวนไว้ให้หมอ"],["Aucune raison, c'est un mythe","ไม่มีเหตุผล เป็นความเชื่อผิดๆ"]],{a:0,f:["La tête est la partie la plus haute ; les pieds, la plus basse : on ne pointe jamais quelqu'un avec le pied. En France, caresser la tête d'un enfant est un geste affectueux banal.","ศีรษะเป็นของสูง เท้าเป็นของต่ำ จึงไม่ใช้เท้าชี้คนอื่น ส่วนในฝรั่งเศส การลูบหัวเด็กเป็นท่าทางแสดงความเอ็นดูธรรมดา"]}],

['quiz','e',"Comment dit-on « je t'aime » en thaï ?","'Je t'aime' ในภาษาไทยพูดว่าอะไร",[["Chan rak thoe","ฉันรักเธอ"],["Sawasdee","สวัสดี"],["Khob khun","ขอบคุณ"],["Aroi","อร่อย"]],{a:0,f:["Un homme dit souvent « phom rak khun ». En français, « je t'aime » est un mot fort : pour un ami, on dit « je t'aime bien », ce qui veut dire… beaucoup moins.","ผู้ชายมักพูดว่า 'ผมรักคุณ' ส่วนภาษาฝรั่งเศส 'je t'aime' แปลว่ารักจริงๆ แต่ถ้าพูด 'je t'aime bien' จะแปลว่าแค่ชอบ ซึ่งน้อยกว่ามาก"],k:["Apprends-moi à le dire avec le bon ton, en vocal. Et toi, dis-le-moi en français.","สอนฉันพูดให้ถูกเสียงเป็นข้อความเสียง แล้วเธอลองพูดเป็นภาษาฝรั่งเศสด้วย"]}],

/* ---------- état ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const myTz=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'Pacific/Tahiti'}catch(e){return 'Pacific/Tahiti'}})();

const S={mode:'boot',backend:null,slot:lsGet('moon.slot'),docs:{A:null,B:null},meta:{},custom:[],tab:lsGet('moon.tab')||'play',cat:lsGet('moon.cat')||'parcours',
  open:null,pending:{},showAlt:{},tr:{},ai:null,lastSeen:Number(lsGet('moon.seen')||0),seenThisVisit:null,obSlot:null,trOut:''};

const P=()=>S.slot==='A'?'B':'A';
const me=()=>S.docs[S.slot];
const pd=()=>S.docs[P()];
const lang=()=>(me()&&me().lang)||((navigator.language||'').startsWith('th')?'th':'fr');
const plang=()=>(pd()&&pd().lang)||(lang()==='fr'?'th':'fr');
function t(k,v={}){let s=(I18N[lang()]||I18N.fr)[k];if(s==null)s=I18N.fr[k]??k;if(typeof s==='string')s=s.replace(/\{(\w+)\}/g,(_,x)=>v[x]??'');return s}
const pname=()=>(pd()&&pd().name)||(lang()==='th'?'ที่รัก':'ton amour');
const L=o=>o?(o[lang()]||o.fr||o.th):'';

/* ---------- stockage : uniquement sur ce téléphone ---------- */
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
function saveMe(){me().updated=Date.now();if(!store.set('moon.me',me()))toast(t('saveErr'))}
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function newDoc(){return{id:rid(),name:'',lang:lang(),tz:myTz,answers:{},reacts:{},stars:{},custom:[]}}
function rebuildCustom(){S.custom=[];['A','B'].forEach(k=>((S.docs[k]&&S.docs[k].custom)||[]).forEach(c=>S.custom.push({...c,by:k})))}
function meetDate(){const a=me()&&me().meet,b=pd()&&pd().meet;if(a&&b)return (a.at>=b.at?a:b).d;return (a||b||{}).d||''}

/* ---------- échange par lien ---------- */
const b64u={enc(u8){let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')},
  dec(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const s=atob(str);return Uint8Array.from(s,c=>c.charCodeAt(0))}};
async function pack(obj){const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){try{const st=new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'));return 'z'+b64u.enc(new Uint8Array(await new Response(st).arrayBuffer()))}catch(e){}}
  return 'j'+b64u.enc(raw)}
async function unpack(code){let u8=b64u.dec(code.slice(1));
  if(code[0]==='z'){const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));u8=new Uint8Array(await new Response(st).arrayBuffer())}
  return JSON.parse(new TextDecoder().decode(u8))}
const extractCode=txt=>{const m=String(txt||'').match(/lune=([zj][A-Za-z0-9_-]+)/);return m?m[1]:null};
async function importCode(code){
  let d;try{d=await unpack(code)}catch(e){toast(t('badCode'));return false}
  if(!d||d.v!==1||!d.p||!d.p.id){toast(t('badCode'));return false}
  const doc=d.p;
  if(doc.id===me().id){toast(t('ownCode'));return false}
  const prev=S.docs.B;
  if(prev&&prev.id===doc.id&&(prev.updated||0)>(doc.updated||0)){toast(t('oldCode'));return false}
  S.docs.B=doc;store.set('moon.partner',doc);rebuildCustom();
  toast(t('imported',{p:doc.name||pname()}));render(true);return true}
async function shareMine(){
  const code=await pack({v:1,p:me()});
  const url=location.origin+location.pathname+'#lune='+code;
  const text=I18N.fr.shareMsg.replace('{n}',me().name)+'\n'+I18N.th.shareMsg.replace('{n}',me().name)+'\n'+url;
  me().sentAt=Date.now();store.set('moon.me',me());
  if(navigator.share){try{await navigator.share({text});render();return}catch(e){if(e&&e.name==='AbortError'){return}}}
  try{await navigator.clipboard.writeText(text);toast(t('copiedShare'))}catch(e){}
  S.shareText=text;S.tab='tr';render(true);
}

/* ---------- logique de jeu ---------- */
function wk(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate()}
const ans=(slot,id)=>S.docs[slot]&&S.docs[slot].answers&&S.docs[slot].answers[id];
const both=id=>!!(ans('A',id)&&ans('B',id));
function allCards(){return CARDS.concat(S.custom.slice().sort((a,b)=>(a.at||0)-(b.at||0)).map(c=>({id:'x_'+c.id,custom:true,lvl:'p',t:'talk',q:c.q,by:c.by})))}
const sessionDone=s=>{const cs=CARDS.filter(c=>c.s===s);return cs.filter(c=>both(c.id)).length>=Math.ceil(cs.length*2/3)};
const unlocked=s=>s===1||sessionDone(s-1);
function cardPts(c){const a=ans('A',c.id),b=ans('B',c.id);if(!a||!b||a.skip||b.skip)return 0;if(c.custom)return 2;let p=LVPTS[c.lvl];if(c.t==='quiz'){if(a.mine===c.a)p++;if(b.mine===c.a)p++}if(c.t==='guess'){if(a.guess===b.mine)p++;if(b.guess===a.mine)p++}return p}
const total=()=>allCards().reduce((n,c)=>n+cardPts(c),0);
function telepathy(){let c=0,n=0;CARDS.filter(x=>x.t==='guess'&&both(x.id)).forEach(x=>{const a=ans('A',x.id),b=ans('B',x.id);if(a.skip||b.skip)return;n+=2;if(a.guess===b.mine)c++;if(b.guess===a.mine)c++});return{c,n}}
const moonsLeft=()=>3-Object.values((me()&&me().answers)||{}).filter(a=>a.skip&&a.wk===wk()).length;
const starsLeft=()=>1-Object.values((me()&&me().stars)||{}).filter(w=>w===wk()).length;
const hash=s=>[...s].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);

/* ---------- dessin de lune ---------- */
function moon(f,size=44){
  const r=size/2-2,c=size/2;let lit='';
  if(f>=.999)lit=`<circle cx="${c}" cy="${c}" r="${r}" fill="var(--moon-lit)"/>`;
  else if(f>0.001){const rx=Math.abs(1-2*f)*r;lit=`<path d="M${c} ${c-r}A${r} ${r} 0 0 1 ${c} ${c+r}A${rx} ${r} 0 0 ${f<.5?0:1} ${c} ${c-r}Z" fill="var(--moon-lit)"/>`}
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="var(--moon-dark)"/>${lit}</svg>`;
}

/* ---------- rendu ---------- */
function clocks(){
  const el=$('#clocks');if(!el||!me())return;
  const f=tz=>{try{return new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:tz}).format(new Date())}catch(e){return '--:--'}};
  const d=tz=>{try{return new Intl.DateTimeFormat('en-CA',{timeZone:tz}).format(new Date())}catch(e){return ''}};
  let s=`<b>${f(me().tz)}</b> ${esc(t('clockMe'))}`;
  if(pd()&&pd().tz){const a=d(me().tz),b=d(pd().tz);const rel=b>a?` (${t('tomorrow')})`:b<a?` (${t('yesterday')})`:'';s+=` · <b>${f(pd().tz)}</b> ${esc(t('clockP',{p:pname()}))}${esc(rel)}`}
  el.innerHTML=s;
}
function keepInputs(root){const v={};root.querySelectorAll('input[id],textarea[id],select[id]').forEach(e=>v[e.id]=e.value);const a=document.activeElement&&document.activeElement.id;return()=>{Object.entries(v).forEach(([k,x])=>{const e=document.getElementById(k);if(e&&e.type!=='date')e.value=x});if(a){const e=document.getElementById(a);if(e&&root.contains(e))e.focus()}}}

function render(fresh){
  const view=$('#view');const restore=fresh?()=>{}:keepInputs(view);
  $('#logo').innerHTML=moon(Math.min(1,total()/100)||.18,34);
  if(me()&&me().name){document.documentElement.lang=lang();$('#brand').textContent=lang()==='th'?'เกมพระจันทร์':'Le Jeu de la Lune'}
  clocks();
  const tabs=$('#tabs');
  if(S.mode==='boot'){return}
  if(!me()||!me().name){tabs.hidden=true;view.innerHTML=onboardView();restore();return}
  tabs.hidden=false;
  tabs.innerHTML=['play','us','tr'].map(k=>`<button data-act="tab" data-v="${k}" aria-current="${S.tab===k}">${esc(t(k==='play'?'tabPlay':k==='us'?'tabUs':'tabTr'))}</button>`).join('');
  view.innerHTML=(S.tab==='us'?usView():S.tab==='tr'?trView():playView());
  restore();
  renderSheet();
}

function tzOptions(sel){const l=TZS.includes(sel)?TZS:[sel,...TZS];return l.map(z=>`<option value="${esc(z)}"${z===sel?' selected':''}>${esc(z.replace('_',' '))}</option>`).join('')}

function tileHtml(c){
  const m=ans(S.slot,c.id),p=ans(P(),c.id);
  const cls=m&&p?'both':(m||p)?'half':'';
  const star=pd()&&pd().stars&&pd().stars[c.id]&&!m;
  const tag=star?'⭐ '+t('yourTurn'):(p&&!m?t('yourTurn'):'');
  return `<button class="tile ${cls}" data-act="open" data-v="${c.id}">${tag?`<span class="tag">${esc(tag)}</span>`:''}
   <span class="meta"><span class="dot lv-${c.lvl}"></span><span class="mono">${esc(t('t_'+c.t))} · ${esc(t('l_'+c.lvl))}</span></span>
   <span class="q">${esc(L(c.q))}</span></button>`;

const intimeOn=()=>!!(me()&&me().intime&&pd()&&pd().intime);
function isOpen(c){if(c.custom)return true;if(c.cat)return c.cat!=='intime'||intimeOn();return unlocked(c.s)}
function playView(){
  let h='<div class="stack">';
  if(!pd()||!pd().name)h+=`<div class="news"><span class="big">${esc(t('noPartner'))}</span><button class="btn small" data-act="send" style="align-self:flex-start">📤 ${esc(t('inviteBtn'))}</button></div>`;
  else if(unsent())h+=`<div class="news"><span>${esc(t('exUnsent',{n:unsent()}))}</span><button class="btn small" data-act="send" style="align-self:flex-start">📤 ${esc(t('sendBtn'))}</button></div>`;
  else{
    const seen=S.seenThisVisit??S.lastSeen;
    const nNew=Object.values(pd().answers||{}).filter(a=>(a.at||0)>seen).length;
    const todo=allCards().filter(c=>isOpen(c)&&ans(P(),c.id)&&!ans(S.slot,c.id)).length;
    const stars=Object.keys(pd().stars||{}).filter(id=>!ans(S.slot,id)).length;
    h+=`<div class="news"><span class="big">${esc(nNew?t('since',{p:pname(),n:nNew}):t('nothingNew',{p:pname()}))}</span>
      ${todo?`<span>${esc(t('waitingCount',{n:todo,p:pname()}))}</span>`:''}${stars?`<span>${esc(t('starList',{p:pname(),n:stars}))}</span>`:''}</div>`;
  }
  const cur=CATS.find(x=>x.k===S.cat)||CATS[0];
  h+=`<div class="chips" role="tablist">${CATS.map(x=>{const cs=deckCards(x.k);const todo=cs.filter(c=>isOpen(c)&&ans(P(),c.id)&&!ans(S.slot,c.id)).length;
    return `<button class="chip" role="tab" data-act="cat" data-v="${x.k}" aria-selected="${x.k===cur.k}">${esc(L(x.n))}${todo?` <b class="cnt">${todo}</b>`:''}</button>`}).join('')}</div>
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:12px"><p class="muted" style="margin:0;font-size:var(--fs-s);min-width:0">${esc(L(cur.d))}</p>${cur.k==='intime'&&!intimeOn()?'':`<button class="btn small" data-act="surprise" style="flex:0 0 auto">🎲 ${esc(t('surprise'))}</button>`}</div>`;
  if(cur.k==='parcours')h+=parcoursView();
  else if(cur.k==='maison')h+=maisonView();
  else if(cur.k==='intime'&&!intimeOn())h+=consentView();
  else h+=deckView(cur.k);
  return h+'</div>';
}
function deckCards(k){if(k==='parcours')return CARDS.filter(c=>c.s);if(k==='maison')return allCards().filter(c=>c.custom);return CARDS.filter(c=>c.cat===k)}
function sortCards(cs){const r=c=>{const m=ans(S.slot,c.id),p=ans(P(),c.id);return !m&&p?0:!m?1:!p?2:3};return cs.slice().sort((a,b)=>r(a)-r(b))}
function deckView(k){
  const cs=deckCards(k);const done=cs.filter(c=>both(c.id)).length;
  return `<section class="session"><div class="s-head">${moon(done/cs.length)}<div><span class="mono muted">${done}/${cs.length}</span><h2>${esc(L(CATS.find(x=>x.k===k).n))}</h2></div></div><div class="tiles">${sortCards(cs).map(tileHtml).join('')}</div>
   ${k==='intime'?`<button class="linkbtn" data-act="intime" data-v="0">${esc(t('intimeOff'))}</button>`:''}</section>`;
}
function consentView(){
  const mine=!!(me()&&me().intime),theirs=!!(pd()&&pd().intime);
  return `<div class="panel"><h2>${esc(t('intimeTitle'))}</h2><p style="margin:0">${esc(t('intimeBody'))}</p>
   <p style="margin:0" class="mono">${esc(t('you'))} : ${mine?'✓ '+esc(t('intimeYes')):esc(t('intimeNotYet'))} · ${esc(pname())} : ${theirs?'✓ '+esc(t('intimeYes')):esc(t('intimeNotYet'))}</p>
   ${mine?`<p class="muted" style="margin:0">${esc(t('intimeWait',{p:pname()}))}</p><button class="btn ghost small" data-act="intime" data-v="0" style="align-self:flex-start">${esc(t('intimeOff'))}</button>`
     :`<button class="btn" data-act="intime" data-v="1" style="align-self:flex-start">${esc(t('intimeAgree'))}</button>`}</div>`;
}
function parcoursView(){
  let h='';
  for(let s=1;s<=6;s++){
    const cs=CARDS.filter(c=>c.s===s);const f=cs.filter(c=>both(c.id)).length/cs.length;const u=unlocked(s);
    h+=`<section class="session"><div class="s-head">${moon(u?f:0)}<div><span class="mono muted">${esc(t('sess',{n:s}))} · ${cs.filter(c=>both(c.id)).length}/${cs.length}</span><h2>${esc(L(SESSIONS[s]))}</h2></div></div>`;
    h+=u?`<div class="tiles">${cs.map(tileHtml).join('')}</div>`:`<div class="locked">${esc(t('locked',{n:s-1}))} · ${esc(t('hidden',{n:cs.length}))}</div>`;
    h+='</section>';
    if(!u)break;
  }
  return h;
}
function maisonView(){
  const cu=allCards().filter(c=>c.custom);

}
function usView(){

  const tp=telepathy();const md=meetDate();

    <div class="bar"><i style="width:${pct}%"></i></div><span class="muted" style="font-size:var(--fs-s)">${esc(nx?t('next',{n:nx.at-pts,r:L(nx.r)}):t('allWon'))}</span>
    <div>${REWARDS.map(r=>`<div class="reward ${pts>=r.at?'won':''}"><span class="pts">${r.at} pts</span><span>${esc(L(r.r))}${pts>=r.at?`<small>${esc(t('won'))}</small>`:''}</span></div>`).join('')}</div>
    <p class="muted" style="font-size:var(--fs-s);margin:0">${esc(t('potRule'))}</p>
    ${tp.n?`<p style="margin:0;font-weight:600">${esc(t('telepathy',tp))}</p>`:''}</div>
  <div class="panel"><h2>${esc(t('jokersTitle'))}</h2>
    <div class="jokers">${[0,1,2].map(i=>`<span class="${i<ml?'':'off'}">🌙</span>`).join('')} <span class="${sl?'':'off'}">⭐</span></div>
    <p style="margin:0;font-size:var(--fs-s)">${esc(t('moonRule',{n:ml}))}<br>${esc(t('starRule',{n:sl}))}<br><span class="muted">${esc(t('jokersBack'))}</span></p></div>

    <label for="st-lang">${esc(t('langLbl'))}<select id="st-lang"><option value="fr"${lang()==='fr'?' selected':''}>Français</option><option value="th"${lang()==='th'?' selected':''}>ภาษาไทย</option></select></label>
    <label for="st-tz">${esc(t('tzLbl'))}<select id="st-tz">${tzOptions(me().tz||myTz)}</select></label>
    <div class="row"><button class="btn" data-act="stsave">${esc(t('save'))}</button></div></div>
  </div>`;
}

function renderSheet(){
  const sc=$('#scrim');
  if(!S.open){sc.hidden=true;sc.innerHTML='';return}
  const c=allCards().find(x=>x.id===S.open);if(!c){S.open=null;sc.hidden=true;return}
  const restore=keepInputs(sc);
  const m=ans(S.slot,c.id),p=ans(P(),c.id);const ol=lang()==='fr'?'th':'fr';
  let h=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(L(c.q))}">
   <div class="row" style="justify-content:space-between"><span class="meta row"><span class="dot lv-${c.lvl}"></span><span class="mono muted">${esc(t('t_'+c.t))} · ${esc(t('l_'+c.lvl))}${c.custom?' · '+esc(t('customBy',{p:c.by===S.slot?t('you'):pname()})):''}</span></span>
   <button class="btn ghost small" data-act="close">${esc(t('close'))}</button></div>
   <div class="qbig">${esc(L(c.q))}</div>
   ${S.showAlt[c.id]?`<div class="alt" lang="${ol}">${esc(c.q[ol])}</div>`:`<button class="linkbtn" data-act="alt">${esc(t('showIn',{l:t('lname_'+ol)}))}</button>`}`;
  if(pd()&&pd().stars&&pd().stars[c.id]&&!m)h+=`<div class="star-note">${esc(t('starFrom',{p:pname()}))}</div>`;
  if(!m)h+=answerForm(c,p);
  else if(!p)h+=`<div class="ans"><span class="who">${esc(t('you'))}</span>${myAnswerSummary(c,m)}</div><p class="wait">${esc(I18N[lang()].waits[hash(c.id)%4].replace('{p}',pname()))}</p>`;
  else h+=reveal(c,m,p);
  h+='</div>';
  sc.innerHTML=h;sc.hidden=false;restore();
}
function answerForm(c,p){
  const pe=S.pending[c.id]||{};let h='';
  if(c.t==='guess'){
    h+=`<div class="step g">${esc(t('guessStep',{p:pname()}))}</div><div class="opts">${c.o.map((o,i)=>`<button class="opt ${pe.guess===i?'g':''}" data-act="pick" data-k="guess" data-v="${i}" aria-pressed="${pe.guess===i}">${esc(L(o))}</button>`).join('')}</div>
     <div class="step m">${esc(t('mineStep'))}</div><div class="opts">${c.o.map((o,i)=>`<button class="opt ${pe.mine===i?'m':''}" data-act="pick" data-k="mine" data-v="${i}" aria-pressed="${pe.mine===i}">${esc(L(o))}</button>`).join('')}</div>
     <button class="btn" data-act="sendguess">${esc(t('send'))}</button>`;
  }else if(c.t==='quiz'){
    h+=`<div class="step m">${esc(t('quizStep'))}</div><div class="opts">${c.o.map((o,i)=>`<button class="opt ${pe.mine===i?'m':''}" data-act="pick" data-k="mine" data-v="${i}" aria-pressed="${pe.mine===i}">${esc(L(o))}</button>`).join('')}</div>
     <button class="btn" data-act="sendquiz">${esc(t('send'))}</button>`;
  }else if(c.t==='talk'){
    h+=`<textarea id="ta-${c.id}" maxlength="2000" placeholder="${esc(t('talkPh'))}"></textarea><button class="btn" data-act="sendtalk">${esc(t('send'))}</button>`;
  }else{
    h+=`<textarea id="ta-${c.id}" maxlength="2000" placeholder="${esc(t('darePh'))}" style="min-height:70px"></textarea><button class="btn" data-act="senddare">${esc(t('dareDone'))}</button>`;
  }
  h+=`<div class="row"><button class="btn ghost small" data-act="moon">${esc(t('useMoon'))} (${Math.max(0,moonsLeft())})</button>`;
  if(!p&&!(me().stars||{})[c.id])h+=`<button class="btn ghost small" data-act="star">${esc(t('useStar'))} (${Math.max(0,starsLeft())})</button>`;
  h+='</div>';
  return h+`<p class="muted" style="margin:0;font-size:var(--fs-s)">${esc(t('noPressure'))}</p>`;

function myAnswerSummary(c,a){
  if(a.skip)return `<p>${esc(t('youSkipped'))}</p>`;
  if(c.t==='quiz')return `<p><span class="muted">${esc(t('answered'))} :</span> ${esc(L(c.o[a.mine]))}</p>`;
  if(c.t==='guess')return `<p><span class="muted">${esc(t('guessed'))} :</span> ${esc(L(c.o[a.guess]))}<br><span class="muted">${esc(t('answered'))} :</span> ${esc(L(c.o[a.mine]))}</p>`;
  return a.text?`<p>${esc(a.text)}</p>`:`<p>✅</p>`;
}
function reveal(c,m,p){
  let h='';
  if(m.skip||p.skip){
    h+=`<div class="duo"><div class="ans"><span class="who">${esc(t('you'))}</span>${myAnswerSummary(c,m)}</div><div class="ans"><span class="who">${esc(pname())}</span>${p.skip?`<p>${esc(t('skippedBy',{p:pname()}))}</p>`:partnerBody(c,p)}</div></div>`;
    return h+extras(c);
  }
  if(c.t==='guess'){
    const okMe=m.guess===p.mine,okP=p.guess===m.mine;const n=okMe+okP;
    h+=`<div class="verdict">${esc(t('v'+n))}</div>`;
    h+=`<div class="duo"><div class="ans"><span class="who">${esc(t('you'))}</span><p><span class="muted">${esc(t('answered'))} :</span> ${esc(L(c.o[m.mine]))}<br><span class="muted">${esc(t('guessed'))} :</span> ${esc(L(c.o[m.guess]))} <span class="${okMe?'ok':'ko'}">${okMe?'✓':'✗'}</span></p></div>
      <div class="ans"><span class="who">${esc(pname())}</span><p><span class="muted">${esc(t('answered'))} :</span> ${esc(L(c.o[p.mine]))}<br><span class="muted">${esc(t('guessed'))} :</span> ${esc(L(c.o[p.guess]))} <span class="${okP?'ok':'ko'}">${okP?'✓':'✗'}</span></p></div></div>`;
  }else if(c.t==='quiz'){
    const okM=m.mine===c.a,okP=p.mine===c.a;
    h+=`<div class="verdict">${esc(okM&&okP?t('q2'):okM?t('q1me'):okP?t('q1p',{p:pname()}):t('q0'))}</div>
      <div class="talk"><b>${esc(t('goodAns'))}</b><br>${esc(L(c.o[c.a]))}</div>
      <div class="duo"><div class="ans"><span class="who">${esc(t('you'))}</span><p>${esc(L(c.o[m.mine]))} <span class="${okM?'ok':'ko'}">${okM?'✓':'✗'}</span></p></div><div class="ans"><span class="who">${esc(pname())}</span><p>${esc(L(c.o[p.mine]))} <span class="${okP?'ok':'ko'}">${okP?'✓':'✗'}</span></p></div></div>`;
  }else{
    if(c.t==='dare')h+=`<div class="verdict">${esc(t('dareBoth'))}</div>`;
    h+=`<div class="duo"><div class="ans"><span class="who">${esc(t('you'))}</span>${myAnswerSummary(c,m)}</div><div class="ans"><span class="who">${esc(pname())}</span>${partnerBody(c,p)}</div></div>`;
  }
  const mr=(me().reacts||{})[c.id],pr=(pd().reacts||{})[c.id];
  h+=`<div class="stack" style="gap:6px"><span class="step">${esc(t('react'))}</span><div class="reacts">${EMOJIS.map(e=>`<button data-act="react" data-v="${e}" aria-pressed="${mr===e}">${e}</button>`).join('')}</div>
     ${pr?`<span class="muted">${esc(t('theirReact',{p:pname()}))} <span style="font-size:1.3rem">${pr}</span></span>`:''}</div>`;
  return h+extras(c);
}
function partnerBody(c,p){
  if(c.t==='guess')return `<p>✓</p>`;
  if(!p.text)return `<p>✅</p>`;
  const tr=S.tr[c.id];
  return `<p>${esc(p.text)}</p>${tr?`<p class="alt">${esc(tr)}</p>`:(plang()!==lang()?`<a class="linkbtn" href="https://translate.google.com/?sl=auto&tl=${lang()}&text=${encodeURIComponent(p.text)}" target="_blank" rel="noopener noreferrer">${esc(t('translate'))} ↗</a>`:'')}`;
}
function extras(c){
  let h='';
  if(c.fact)h+=`<div class="fact"><b>${esc(t('fact'))}</b><br>${esc(L(c.fact))}</div>`;
  if(c.talk)h+=`<div class="talk"><b>💬 ${esc(t('talkAbout'))}</b><br>${esc(L(c.talk))}</div>`;
  return h;
}

/* ---------- actions ---------- */
let toastT;
function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}
function record(id,data){me().answers=me().answers||{};me().answers[id]={...data,at:Date.now(),wk:wk()};saveMe();delete S.pending[id];render(true);toast(t('nudge',{p:pname()}))}

document.addEventListener('click',async ev=>{
  if(ev.target.id==='scrim'){S.open=null;renderSheet();return}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;const c=S.open&&allCards().find(x=>x.id===S.open);
  switch(a){
  case 'obgo':{const name=$('#ob-name').value.trim();if(!name){$('#ob-name').focus();return}
    const d=me()||newDoc();d.name=name;d.lang=$('#ob-lang').value;d.tz=$('#ob-tz').value;S.docs.A=d;saveMe();
    if(S.pendingCode){const c=S.pendingCode;S.pendingCode=null;await importCode(c)}render(true);break}
  case 'tab':S.tab=v;lsSet('moon.tab',v);render(true);window.scrollTo(0,0);break;
  case 'cat':S.cat=v;lsSet('moon.cat',v);render(true);break;
  case 'intime':me().intime=v==='1';saveMe();render(true);break;
  case 'open':S.open=v;renderSheet();break;
  case 'close':S.open=null;renderSheet();break;
  case 'alt':S.showAlt[S.open]=true;renderSheet();break;
  case 'pick':{const pe=S.pending[S.open]=S.pending[S.open]||{};pe[b.dataset.k]=Number(v);renderSheet();break}
  case 'sendguess':{const pe=S.pending[S.open]||{};if(pe.guess==null||pe.mine==null){toast(t('pickBoth'));return}record(S.open,{guess:pe.guess,mine:pe.mine});break}
  case 'sendquiz':{const pe=S.pending[S.open]||{};if(pe.mine==null){toast(t('pickOne'));return}record(S.open,{mine:pe.mine});break}
  case 'surprise':{const pool=deckCards(S.cat).filter(c=>isOpen(c)&&!ans(S.slot,c.id));if(!pool.length){toast(t('allPlayed'));return}const waiting=pool.filter(c=>ans(P(),c.id));const src=waiting.length&&Math.random()<.5?waiting:pool;const pick=src[Math.floor(Math.random()*src.length)];S.open=pick.id;renderSheet();break}
  case 'sendtalk':{const x=$('#ta-'+S.open);const tx=x?x.value.trim():'';if(!tx){x&&x.focus();return}record(S.open,{text:tx});break}
  case 'senddare':{const x=$('#ta-'+S.open);record(S.open,{done:true,text:x?x.value.trim():''});break}
  case 'moon':if(moonsLeft()<=0){toast(t('noMoon'));return}record(S.open,{skip:true});break;
  case 'star':if(starsLeft()<=0){toast(t('noStar'));return}me().stars=me().stars||{};me().stars[S.open]=wk();saveMe();toast(t('starSent',{p:pname()}));render(true);break;
  case 'react':me().reacts=me().reacts||{};if(me().reacts[S.open]===v)delete me().reacts[S.open];else me().reacts[S.open]=v;saveMe();renderSheet();break;
  case 'trans':{const p=ans(P(),S.open);b.textContent=t('translating');b.disabled=true;try{0}catch(e){toast(t('trErr'))}renderSheet();break}
  case 'cuadd':{const x=$('#cu-q');const q=x.value.trim();if(!q){x.focus();return}
    me().custom=me().custom||[];me().custom.push({id:rid(),q:{fr:q,th:q},at:Date.now()});saveMe();rebuildCustom();x.value='';toast(t('customAdded'));render(true);break}
  case 'send':try{await shareMine()}catch(e){toast(t('saveErr'))}break;
  case 'receive':{const c=extractCode($('#ex-in').value);if(!c){toast(t('badCode'));return}if(await importCode(c))$('#ex-in').value='';break}
  case 'stsave':me().name=$('#st-name').value.trim()||me().name;me().lang=$('#st-lang').value;me().tz=$('#st-tz').value;saveMe();render(true);toast(t('saved'));break;
  }
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='meet'){me().meet={d:ev.target.value,at:Date.now()};saveMe();render(true)}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.open){S.open=null;renderSheet()}});

/* ---------- démarrage ---------- */
function showFatal(msg){const v=$('#view');if(v)v.insertAdjacentHTML('afterbegin',`<p class="banner">Erreur · ข้อผิดพลาด : ${esc(msg)}</p>`)}
window.addEventListener('error',e=>showFatal(e.message||'?'));
async function boot(){
  S.mode='local';S.slot='A';
  S.docs.A=store.get('moon.me');S.docs.B=store.get('moon.partner');rebuildCustom();
  const code=extractCode(location.hash);
  if(code){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    if(me()&&me().name)await importCode(code);else S.pendingCode=code}
  if(S.seenThisVisit==null){S.seenThisVisit=S.lastSeen;lsSet('moon.seen',String(Date.now()))}
  render(true);
}
window.addEventListener('hashchange',()=>{const c=extractCode(location.hash);if(c&&me()&&me().name){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}importCode(c)}});
setInterval(clocks,30000);
boot();
</script>
